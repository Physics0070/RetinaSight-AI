name: retinasight
description: >-
  RetinaSight AI — offline-first retinal screening for community health workers.
  Guided capture, on-device quality gating, encrypted local storage and
  background synchronisation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera + image handling
  camera: ^0.11.0
  image: ^4.2.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Encrypted local persistence (offline-first store + sync queue)
  sqflite_sqlcipher: ^3.1.0
  sqflite_common: ^2.5.4
  flutter_secure_storage: ^9.2.2

  # Connectivity + networking
  connectivity_plus: ^6.0.3
  http: ^1.2.1

  # State
  provider: ^6.1.2

  # Edge inference (used when a real exported model is present;
  # the app degrades honestly to cloud inference when it is not).
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
