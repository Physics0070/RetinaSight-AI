# RetinaSight AI â€” Render blueprint.
#
# NO SECRETS LIVE HERE. Every value marked `sync: false` must be set in the
# Render dashboard (or generated by Render). This file is committed; secrets
# are not.
#
# Deploy:  Render Dashboard -> New -> Blueprint -> point at this repository.
# See docs/DEPLOYMENT.md for the full runbook.

databases:
  - name: retinasight-db
    databaseName: retinasight
    user: retinasight
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: singapore

services:
  # ------------------------------------------------------------------ #
  # API
  # ------------------------------------------------------------------ #
  - type: web
    name: retinasight-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements-serve.txt
    # Render injects $PORT; the app reads it rather than assuming 8000.
    startCommand: >-
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: RS_ENV
        value: production
      - key: RS_DEBUG
        value: "false"
      - key: RS_LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.12.9"

      - key: RS_DATABASE_URL
        fromDatabase:
          name: retinasight-db
          property: connectionString

      # Generated once by Render, then held as secrets.
      - key: RS_JWT_SECRET
        generateValue: true
      - key: RS_JWT_REFRESH_SECRET
        generateValue: true
      - key: RS_STORAGE_SIGNING_SECRET
        generateValue: true

      # Object storage. The service REFUSES to start on filesystem storage in
      # production â€” a container disk is ephemeral and retinal images would be
      # lost on every deploy.
      - key: RS_STORAGE_PROVIDER
        value: s3
      - key: RS_S3_BUCKET
        sync: false
      - key: RS_S3_REGION
        sync: false
      - key: RS_S3_ENDPOINT_URL
        sync: false
      - key: RS_S3_ACCESS_KEY_ID
        sync: false
      - key: RS_S3_SECRET_ACCESS_KEY
        sync: false

      # Public origin, used to build signed image URLs.
      - key: RS_PUBLIC_BASE_URL
        sync: false
      - key: RS_CORS_ORIGINS
        sync: false

      # Model serving.
      #
      # This MUST be `onnx`. ModelRegistry.resolve() reads the database first
      # and falls back to these variables when nothing is registered â€” which is
      # exactly the state of a freshly provisioned database. Left as
      # `development`, a new deployment would grade real retinal images with
      # the placeholder stub from day one.
      #
      # The version string must match the committed FILENAME
      # (ml/models/dr-v2.onnx), because the settings fallback loads
      # `{RS_MODEL_DIR}/{RS_ACTIVE_MODEL_VERSION}.onnx`. It is NOT the registry
      # version, which is "v2" â€” using that yields an unavailable model.
      - key: RS_MODEL_PROVIDER
        value: onnx
      - key: RS_ACTIVE_MODEL_VERSION
        value: dr-v2

      # Bootstrap administrator. Set a real password before the first deploy â€”
      # init_db refuses to create a production admin with the default.
      - key: RS_SEED_ADMIN_EMAIL
        sync: false
      - key: RS_SEED_ADMIN_PASSWORD
        sync: false

  # ------------------------------------------------------------------ #
  # Dashboard
  # ------------------------------------------------------------------ #
  - type: web
    name: retinasight-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Single-page app: every unknown path resolves to index.html so the
      # router can handle it.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ------------------------------------------------------------------ #
  # Background worker
  # ------------------------------------------------------------------ #
  # Runs inference and Grad-CAM off the request path. Enable by setting
  # RS_INFERENCE_MODE=worker on the API service.
  - type: worker
    name: retinasight-worker
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements-serve.txt
    startCommand: python -m scripts.run_worker
    autoDeploy: false
    envVars:
      - key: RS_ENV
        value: production
      - key: RS_LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: RS_DATABASE_URL
        fromDatabase:
          name: retinasight-db
          property: connectionString
      # Must match the API service exactly, or signed URLs will not verify.
      - key: RS_STORAGE_SIGNING_SECRET
        fromService:
          name: retinasight-api
          type: web
          envVarKey: RS_STORAGE_SIGNING_SECRET
      - key: RS_STORAGE_PROVIDER
        value: s3
      - key: RS_S3_BUCKET
        sync: false
      - key: RS_S3_REGION
        sync: false
      - key: RS_S3_ENDPOINT_URL
        sync: false
      - key: RS_S3_ACCESS_KEY_ID
        sync: false
      - key: RS_S3_SECRET_ACCESS_KEY
        sync: false
      # Must match the API service, or the worker grades with a different model
      # than the one the API reports.
      - key: RS_MODEL_PROVIDER
        value: onnx
      - key: RS_ACTIVE_MODEL_VERSION
        value: dr-v2
